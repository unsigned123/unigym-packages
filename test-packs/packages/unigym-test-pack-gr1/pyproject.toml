[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "unigym-test-pack-gr1"
version = "0.2.0"
description = "GR1 robot profile content pack for unigym tests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.entry-points."unigym.test_packs"]
gr1 = "unigym_test_pack_gr1:pack_root"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unigym_test_pack_gr1 = [
    "py.typed",
    "pack/*.yaml",
    "pack/*/*.yaml",
]
