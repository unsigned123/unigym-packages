[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "unigym-test-packs"
version = "0.1.0"
description = "Pytest plugin for installed unigym test packs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0,<10.0",
    "unigym>=0.110,<0.111",
]

[project.entry-points.pytest11]
unigym_test_packs = "unigym_test_packs.plugin"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unigym_test_packs = ["py.typed"]
