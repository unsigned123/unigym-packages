[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unigym-rl"
version = "0.0.0"
description = "L2 task-environment contract over unigym core (R0 skeleton)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "unigym",
    "torch",
    "numpy",
]

[project.optional-dependencies]
gymnasium = ["gymnasium>=1.0,<2"]
skrl = ["skrl>=2.1,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
