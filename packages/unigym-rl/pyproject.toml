[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unigym-rl"
version = "0.2.2"
description = "L2 task-environment layer over unigym core"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "unsigned123" }]
dependencies = [
    "unigym>=0.110,<0.111",
    "torch",
    "numpy",
]

[project.optional-dependencies]
gymnasium = ["gymnasium>=1.0,<2"]
skrl = ["skrl>=2.1,<3"]

[project.urls]
Homepage = "https://github.com/unsigned123/unigym-packages"
Source = "https://github.com/unsigned123/unigym-packages/tree/main/packages/unigym-rl"
Core = "https://github.com/unsigned123/unigym"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
